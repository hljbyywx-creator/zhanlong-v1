<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斩龙封神</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e0cc radial-gradient(ellipse at center, #efe7d5 0%, #e8dcc3 70%, #d8c9ab 100%) fixed; }
  body { font-family: "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; color: #1a1612; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; box-shadow: 0 0 18px rgba(40, 30, 20, .22); }
  #cv { display: block; width: 100%; height: 100%; background: #efe7d5; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; transition: opacity .6s; }
  #ui.hide { opacity: 0; cursor: none; }
  #bar { position: absolute; left: 4%; right: 4%; bottom: 18px; height: 16px; cursor: pointer; }
  #bar .track { position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: rgba(40, 32, 24, .22); }
  #bar .fill { position: absolute; left: 0; top: 7px; height: 2px; background: rgba(30, 24, 18, .75); width: 0; }
  #bar .tick { position: absolute; top: 3px; width: 1px; height: 10px; background: rgba(30, 24, 18, .5); }
  #bar .lab { position: absolute; top: -18px; font-size: 12px; letter-spacing: 2px; color: rgba(30, 24, 18, .7); transform: translateX(4px); white-space: nowrap; }
  #pz { position: absolute; right: 4%; bottom: 40px; font-size: 13px; letter-spacing: 3px; color: rgba(30, 24, 18, .7); }
  .veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 1.2s; }
  #cover { background: radial-gradient(ellipse at center, #f1e9d8 0%, #e8dcc3 70%, #d8c9ab 100%); }
  #cover .dot { position: absolute; left: 31.77%; top: 41.85%; width: 4.2%; aspect-ratio: 1; transform: translate(-50%, -50%); background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><defs><filter id='a' x='-30%' y='-30%' width='160%' height='160%'><feTurbulence type='fractalNoise' baseFrequency='.11' numOctaves='3' seed='7'/><feDisplacementMap in='SourceGraphic' scale='11'/><feGaussianBlur stdDeviation='.5'/></filter><filter id='b' x='-40%' y='-40%' width='180%' height='180%'><feTurbulence type='fractalNoise' baseFrequency='.07' numOctaves='2' seed='3'/><feDisplacementMap in='SourceGraphic' scale='16'/><feGaussianBlur stdDeviation='2.2'/></filter></defs><ellipse cx='40' cy='41' rx='22' ry='19' fill='%231a1612' fill-opacity='.16' filter='url(%23b)'/><ellipse cx='39' cy='40' rx='13' ry='11.5' fill='%231a1612' fill-opacity='.93' filter='url(%23a)'/><circle cx='58' cy='30' r='1.6' fill='%231a1612' fill-opacity='.7' filter='url(%23a)'/><circle cx='24' cy='55' r='1.1' fill='%231a1612' fill-opacity='.6'/></svg>") center / contain no-repeat; }
  .btn { position: relative; font-family: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 40px; letter-spacing: .5em; padding: 8px 0 8px .5em; border: 0; background: none; color: #1a1612; cursor: pointer; transition: text-shadow .4s; }
  .btn:hover { text-shadow: 0 0 12px rgba(26, 22, 18, .25); }
  .btn:disabled { cursor: wait; }
  #cover .hint { margin-top: 26px; font-size: 13px; letter-spacing: 4px; color: rgba(30, 24, 18, .45); }
  #again { background: none; pointer-events: none; justify-content: flex-end; padding-bottom: 9%; box-sizing: border-box; }
  #again .btn { pointer-events: auto; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui" class="hide"><div id="pz"></div><div id="bar"><div class="track"></div><div class="fill"></div></div></div>
  <div id="again" class="veil" style="opacity:0;display:none"><button class="btn" id="againBtn">重看</button></div>
  <div id="cover" class="veil"><div class="dot"></div><button class="btn" id="startBtn" disabled style="opacity:.35">开卷</button><div class="hint">空格 暂停 · ← → 跳幕</div></div>
</div>
<script src="fonts.js" onerror="window.CINE_FONTS = null"></script>
<script src="plates.js" onerror="window.CINE_PLATES = null"></script>
<script src="voice-assets.js" onerror="window.CINE_VOICES = null"></script>
<script src="js/timemap.js" onerror="window.CINE_TIMEMAP = null"></script>
<script src="js/engine.js"></script>
<script src="js/lib-rig.js"></script>
<script src="js/lib-text.js"></script>
<script src="js/lib-ledger.js"></script>
<script src="js/lib-flow.js"></script>
<script src="js/lib-fx.js"></script>
<script src="js/lib-motion.js"></script>
<script src="js/lib-zhanlong.js"></script>
<script src="audio/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/voice.js"></script>
<script src="js/act-prologue.js"></script>
<script src="js/act1.js"></script>
<script src="js/act2.js"></script>
<script src="js/act3.js"></script>
<script src="js/act4.js"></script>
<script src="js/act5.js"></script>
<script src="js/act-coda.js"></script>
<script>CINE.boot();</script>
</body>
</html>
